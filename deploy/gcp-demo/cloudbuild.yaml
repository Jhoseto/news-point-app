# Cloud Build: build + deploy temporary investor demo (web + Studio on Cloud Run).
# Connect this repo in GCP Console -> Cloud Build -> Repositories, then create a trigger
# on your branch with config file: deploy/gcp-demo/cloudbuild.yaml
#
# First-time GCP setup: docs/gcp-demo/SETUP.md (secrets, services, substitutions).

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: europe-west3
  _AR_REPO: newspoint-demo
  _WEB_SERVICE: newspoint-web-demo
  _STUDIO_SERVICE: newspoint-studio-demo

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/np-demo-database-url/versions/latest
      env: DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/np-demo-database-url-session/versions/latest
      env: DATABASE_URL_SESSION

steps:
  - id: build-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker build -f deploy/gcp-demo/docker/web.Dockerfile \
          --build-arg "DATABASE_URL=$$DATABASE_URL" \
          --build-arg "DATABASE_URL_SESSION=$$DATABASE_URL_SESSION" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:$COMMIT_SHA" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:latest" \
          .
    secretEnv: [DATABASE_URL, DATABASE_URL_SESSION]

  - id: build-studio
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker build -f deploy/gcp-demo/docker/studio.Dockerfile \
          --build-arg "DATABASE_URL=$$DATABASE_URL" \
          --build-arg "DATABASE_URL_SESSION=$$DATABASE_URL_SESSION" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/studio:$COMMIT_SHA" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/studio:latest" \
          .
    secretEnv: [DATABASE_URL, DATABASE_URL_SESSION]

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web"]
    waitFor: [build-web]

  - id: push-studio
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/studio"]
    waitFor: [build-studio]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ["deploy/gcp-demo/scripts/deploy-cloudrun.sh"]
    env:
      - REGION=${_REGION}
      - AR_REPO=${_AR_REPO}
      - WEB_SERVICE=${_WEB_SERVICE}
      - STUDIO_SERVICE=${_STUDIO_SERVICE}
      - IMAGE_TAG=$COMMIT_SHA
      - PROJECT_ID=$PROJECT_ID
    waitFor: [push-web, push-studio]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/studio:$COMMIT_SHA
