# Cloud Build: build + deploy temporary investor demo (web + Studio on Cloud Run).
# Connect repo → trigger on branch → this file (or root cloudbuild.yaml).

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: europe-west3
  _AR_REPO: newspoint-demo
  _WEB_SERVICE: newspoint-web-demo
  _STUDIO_SERVICE: newspoint-studio-demo

steps:
  - id: verify-config
    name: ubuntu
    entrypoint: bash
    args:
      - -ceu
      - |
        echo "NewsPoint demo build — no Secret Manager at build time (commit $COMMIT_SHA)"
        test -f deploy/gcp-demo/docker/web.Dockerfile

  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/gcp-demo/docker/web.Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:latest
      - .
    waitFor: [verify-config]

  - id: build-studio
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/gcp-demo/docker/studio.Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/studio:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/studio:latest
      - .

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web"]
    waitFor: [build-web]

  - id: push-studio
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/studio"]
    waitFor: [build-studio]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ["deploy/gcp-demo/scripts/deploy-cloudrun.sh"]
    env:
      - REGION=${_REGION}
      - AR_REPO=${_AR_REPO}
      - WEB_SERVICE=${_WEB_SERVICE}
      - STUDIO_SERVICE=${_STUDIO_SERVICE}
      - IMAGE_TAG=$COMMIT_SHA
      - PROJECT_ID=$PROJECT_ID
    waitFor: [push-web, push-studio]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/studio:$COMMIT_SHA
